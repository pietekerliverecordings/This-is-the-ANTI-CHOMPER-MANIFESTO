
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anti-Chomper // Screen Saver</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050705;
    color: #8aff8a;
    font-family: "Courier New", monospace;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-shadow: 0 0 8px #39ff1466;
}

.screen {
    width: 90%;
    max-width: 900px;
    animation: breathe 5s ease-in-out infinite;
}

.logo {
    font-size: 12px;
    letter-spacing: 5px;
    color: #467b46;
    margin-bottom: 55px;
}

.message {
    font-size: clamp(22px, 4vw, 42px);
    font-weight: bold;
    line-height: 1.4;
    min-height: 3em;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 1;
    transition: opacity 1.2s ease;
}

.sub {
    margin-top: 35px;
    color: #467b46;
    font-size: 12px;
    letter-spacing: 2px;
}

.cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #8aff8a;
    margin-left: 8px;
    animation: blink 1s steps(2) infinite;
}

.footer {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    font-size: 11px;
    color: #294b29;
    letter-spacing: 2px;
}

@keyframes blink {
    50% { opacity: 0; }
}

@keyframes breathe {
    0%, 100% { opacity: .85; }
    50% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>
<div class="screen">
    <div class="logo">TAPER.EXE &nbsp; // &nbsp; SYSTEM IDLE</div>

    <div class="message" id="message">
        PLEASE STAND BY.
    </div>

    <div class="sub" id="sub">
        AUDIO PRESERVATION SYSTEM
    </div>

    <div><span class="cursor"></span></div>
</div>

<div class="footer">
    ALL RIGHTS RESERVED BY THE CHOMPERS YOU DIDN'T ASK FOR
</div>

<script>
const messages = [
    ["PLEASE STAND BY.", "WAITING FOR THE CHOMPERS TO SHUT UP"],
    ["24-BIT / 48 kHz", "14-BIT CONVERSATION DETECTED"],
    ["SIGNAL: CLEAN", "NEIGHBOR: FUCKING LOUD"],
    ["RECORDING...", "YOUR LIFE STORY IS NOW IN THE ARCHIVE"],
    ["MICROPHONES ARE NOT DECORATIONS.", "NEITHER IS COMMON SENSE."],
    ["PHISH: 30-MINUTE JAM", "BRO: 31-MINUTE CONVERSATION"],
    ["TAPER MODE: ACTIVE", "CHOMPER FILTER: NOT INVENTED YET"],
    ["LOW NOISE FLOOR", "HIGH NOISE NEIGHBOR"],
    ["PLEASE ENJOY THE MUSIC.", "YOUR PODCAST CAN WAIT."],
    ["AUD MASTERING: 6 HOURS", "CHOMPER: 2 HOURS OF NONSTOP BULLSHIT"],
    ["STEALTH MODE: ON", "SOCIAL AWARENESS: OFF"],
    ["ARCHIVE QUALITY: EXCELLENT", "PARKING STORY: PERMANENT"],
    ["YOUR WHISPER IS NOT A WHISPER.", "THE MICROPHONES HEARD EVERYTHING."],
    ["TRACKING: LEFT / RIGHT", "CHOMPING: EVERYWHERE"],
    ["THE BAND IS PLAYING.", "TAKE THE FUCKING HINT."],
    ["PLEASE LOWER YOUR VOICE.", "THIS IS NOT YOUR LIVING ROOM."],
    ["RECORDING SAVED.", "YOUR CONVERSATION SAVED FOREVER."],
    ["NO TALKING DURING THE QUIET PART.", "IT'S NOT COMPLICATED."],
    ["RESPECT THE MUSIC.", "RESPECT THE RECORDING."],
    ["SYSTEM IDLE.", "CHOMPER STILL RUNNING."]
];

const message = document.getElementById("message");
const sub = document.getElementById("sub");

let current = -1;

function nextMessage() {
    message.style.opacity = 0;

    setTimeout(() => {
        let next;
        do {
            next = Math.floor(Math.random() * messages.length);
        } while (next === current && messages.length > 1);

        current = next;
        message.textContent = messages[current][0];
        sub.textContent = messages[current][1];
        message.style.opacity = 1;
    }, 1200);
}

nextMessage();
setInterval(nextMessage, 6500);
</script>
</body>
</html>
